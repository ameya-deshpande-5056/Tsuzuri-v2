# ==============================================================================
# Gradle & JVM Performance Configuration (Guaranteed >= 4GB Free RAM)
# ==============================================================================

# Main Gradle Daemon Memory:
# Strictly capped to 1536m heap + 384m metaspace + 128m code cache (~2.0 GB max).
# MinHeapFreeRatio and MaxHeapFreeRatio instruct JVM to actively shrink and return
# unused heap memory back to the OS.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+UseParallelGC -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin Compiler Daemon Memory:
# Strictly capped to 768m heap + 256m metaspace (~1.0 GB max).
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m

# Daemon Lifecycle:
# Reclaim memory promptly: shuts down daemon after 2 minutes of idle time.
org.gradle.daemon.idletimeout=120000

# Concurrency & Worker Management:
# Strictly capped to 2 parallel worker processes to prevent native memory spikes
# from simultaneous AAPT2, D8, and Kotlin compiler invocations.
org.gradle.workers.max=2

# Build Caching & Execution:
# Parallelizes independent module tasks while strictly bound by the 2-worker cap.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true

# Android Gradle Plugin Optimizations:
android.useAndroidX=true
android.enableR8.fullMode=true
android.nonTransitiveRClass=true
