<body class="light">
  <main class="document-container" id="content">
    <!-- Rendered document will be inserted here -->
  </main>

  <!-- Actions Menu Popover (Parity with Tauri Tsuzuri desktop popover) -->
  <div id="popover-backdrop" class="popover-backdrop" aria-hidden="true"></div>
  <aside id="actions-popover" class="actions-popover" aria-label="Document Actions" aria-hidden="true">
    <div class="popover-header">
      <span class="popover-title">Actions</span>
      <button id="btn-close-popover-x" class="popover-close-btn" title="Close" aria-label="Close Actions Menu">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="popover-body">
      <div class="popover-actions">
        <button class="popover-action-item" onclick="sendAction('toggleMode')" title="Edit Document (Ctrl+E)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
            <path d="m15 5 4 4"></path>
          </svg>
          <span>Edit Document</span>
          <kbd class="menu-shortcut-badge">Ctrl+E</kbd>
        </button>
        <button class="popover-action-item" onclick="sendAction('openFile')" title="Open Document (Ctrl+O)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
          </svg>
          <span>Open Document...</span>
          <kbd class="menu-shortcut-badge">Ctrl+O</kbd>
        </button>
        <button class="popover-action-item" onclick="sendAction('saveFile')" title="Save Document (Ctrl+S)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span>Save Document</span>
          <kbd class="menu-shortcut-badge">Ctrl+S</kbd>
        </button>
        <button class="popover-action-item" onclick="sendAction('saveAsFile')" title="Save As (Ctrl+Shift+S)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span>Save As...</span>
          <kbd class="menu-shortcut-badge">Ctrl+Shift+S</kbd>
        </button>
        <button class="popover-action-item" onclick="sendAction('toggleWordWrap')" title="Toggle Word Wrap (Alt+Z)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 10 4 15 9 20"></polyline>
            <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
          </svg>
          <span id="popover-wrap-label">Word Wrap: On</span>
          <kbd class="menu-shortcut-badge">Alt+Z</kbd>
        </button>
        <button class="popover-action-item" onclick="sendAction('about')" title="About Tsuzuri">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>About Tsuzuri</span>
        </button>
      </div>

      <div class="popover-section-title">Theme</div>
      <div class="popover-theme-switcher">
        <button id="popover-theme-system" class="popover-theme-btn" data-theme-mode="system" onclick="selectTheme('system')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span>System</span>
        </button>
        <button id="popover-theme-light" class="popover-theme-btn" data-theme-mode="light" onclick="selectTheme('light')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
          </svg>
          <span>Light</span>
        </button>
        <button id="popover-theme-dark" class="popover-theme-btn" data-theme-mode="dark" onclick="selectTheme('dark')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span>AMOLED Dark</span>
        </button>
      </div>
    </div>
  </aside>

              variants: [
                { begin: '\\$[A-Za-z_][0-9A-Za-z_]*' },
                { begin: '\\$\\{', end: '\\}', contains: ['self', hljs.C_NUMBER_MODE] }
              ]
            };
            var STRING = {
              className: 'string',
              variants: [
                { begin: "r'''", end: "'''" },
                { begin: 'r"""', end: '"""' },
                { begin: "r'", end: "'" },
                { begin: 'r"', end: '"' },
                { begin: "'''", end: "'''", contains: [hljs.BACKSLASH_ESCAPE, SUBST] },
                { begin: '"""', end: '"""', contains: [hljs.BACKSLASH_ESCAPE, SUBST] },
                { begin: "'", end: "'", contains: [hljs.BACKSLASH_ESCAPE, SUBST] },
                { begin: '"', end: '"', contains: [hljs.BACKSLASH_ESCAPE, SUBST] }
              ]
            };
            var KEYWORDS = {
              keyword:
                'abstract as assert async await base break case catch class const ' +
                'continue covariant default deferred do dynamic else enum export ' +
                'extends extension external factory false final finally for Function ' +
                'get hide if implements import in interface is late library mixin ' +
                'new null of on operator part required rethrow return sealed set show ' +
                'static super switch sync this throw true try typedef var void ' +
                'when while with yield',
              built_in:
                'int double String bool num dynamic Object print Null Never List Set Map ' +
                'Iterable Future Stream Duration DateTime Uri RegExp',
              literal: 'true false null'
            };

            return {
              name: 'Dart',
              keywords: KEYWORDS,
              contains: [
                STRING,
                hljs.C_LINE_COMMENT_MODE,
                hljs.C_BLOCK_COMMENT_MODE,
                {
                  className: 'class',
                  beginKeywords: 'class interface enum mixin extension',
                  end: /[{;]/,
                  excludeEnd: true,
                  contains: [
                    { beginKeywords: 'extends with implements' },
                    hljs.UNDERSCORE_TITLE_MODE
                  ]
                },
                hljs.C_NUMBER_MODE,
                {
                  className: 'meta',
                  begin: '@[A-Za-z]+'
                },
                {
                  className: 'title function_',
                  begin: '\\b[A-Za-z_][0-9A-Za-z_]*(?=\\s*\\()'
                }
              ]
            };
          });
        }
      }

      function normalizeCodeLanguage(language) {
        var lang = String(language || 'plaintext').trim().toLowerCase().replace(/[^\w-]/g, '') || 'plaintext';
        var aliases = {
          cplusplus: 'cpp',
          cxx: 'cpp',
          csharp: 'cs',
          dartlang: 'dart',
          golang: 'go',
          javascript: 'js',
          jsx: 'js',
          node: 'js',
          nodejs: 'js',
          typescript: 'ts',
          tsx: 'ts',
          py: 'python',
          rb: 'ruby',
          rs: 'rust',
          shell: 'bash',
          sh: 'bash',
          zsh: 'bash',
          yml: 'yaml'
        };
        return aliases[lang] || lang;
      }

      function highlightFallbackCode(code, language) {
        var escaped = escapeHtml(code);
        var rules = [
          [/(&quot;.*?&quot;|'.*?'|`[\s\S]*?`)/g, 'hljs-string'],
          [/(#.*$|\/\/.*$)/gm, 'hljs-comment'],
          [/\b(\d+(?:\.\d+)?)\b/g, 'hljs-number'],
          [/\b(true|false|null|undefined|None|nil|TRUE|FALSE|NULL)\b/g, 'hljs-literal'],
          [/\b(abstract|as|assert|async|await|break|case|catch|class|const|continue|default|do|else|enum|export|extends|external|false|final|finally|for|function|get|if|implements|import|in|interface|is|let|new|null|return|set|static|super|switch|this|throw|true|try|typedef|var|void|while|with|yield|def|lambda|from|elif)\b/g, 'hljs-keyword']
        ];
        var result = escaped;
        rules.forEach(function(rule) {
          result = result.replace(rule[0], '<span class="' + rule[1] + '">$1</span>');
        });
        return result;
      }

      function initMarkdownIt() {
        if (typeof window.markdownit !== 'function') return;

        registerExtraLanguages();

        md = window.markdownit({
          html: true,
          xhtmlOut: false,
          breaks: true,
          langPrefix: 'language-',
          linkify: true,
          typographer: true,
          highlight: function(code, lang) {
            var language = normalizeCodeLanguage(lang);
            if (language === 'mermaid') {
              return '<div class="mermaid-block" data-source="' + encodeURIComponent(code) + '"><pre class="mermaid">' + escapeHtml(code) + '</pre></div>';
            }

            if (window.hljs && window.hljs.getLanguage(language)) {
              try {
                return '<pre class="hljs"><code class="language-' + language + '">' + window.hljs.highlight(code, { language: language, ignoreIllegals: true }).value + '</code></pre>';
              } catch (e) {}
            }
            return '<pre class="hljs"><code class="language-' + language + '">' + highlightFallbackCode(code, language) + '</code></pre>';
          }
        });

        if (window.markdownitFootnote) md.use(window.markdownitFootnote);
        if (window.markdownitTaskLists) md.use(window.markdownitTaskLists, { enabled: true, label: true });

        // Custom fence rule with distinguishable section container, language header, and copy button
        md.renderer.rules.fence = function(tokens, idx, options, env, self) {
          var token = tokens[idx];
          var info = token.info ? token.info.trim() : '';
          var rawLang = info.split(/\s+/)[0];
          var lang = normalizeCodeLanguage(rawLang);

          if (lang === 'mermaid') {
            return '<div class="mermaid-block" data-source="' + encodeURIComponent(token.content) + '"><pre class="mermaid">' + escapeHtml(token.content) + '</pre></div>\n';
          }

          var displayLabel = rawLang ? rawLang.toLowerCase() : (lang !== 'plaintext' ? lang : 'text');
          var highlightedCode;

          if (window.hljs && window.hljs.getLanguage(lang)) {
            try {
              highlightedCode = window.hljs.highlight(token.content, { language: lang, ignoreIllegals: true }).value;
            } catch (e) {
              highlightedCode = highlightFallbackCode(token.content, lang);
            }
          } else {
            highlightedCode = highlightFallbackCode(token.content, lang);
          }

          return '<div class="code-block-wrapper" data-lang="' + escapeHtml(displayLabel) + '">' +
            '<div class="code-block-header">' +
              '<span class="code-block-lang">' + escapeHtml(displayLabel) + '</span>' +
              '<button class="code-copy-btn" onclick="copyCode(this)" aria-label="Copy code">Copy</button>' +
            '</div>' +
            '<pre class="hljs"><code class="language-' + escapeHtml(lang) + '">' + highlightedCode + '</code></pre>' +
          '</div>\n';
        };

        md.renderer.rules.code_block = function(tokens, idx, options, env, self) {
          var token = tokens[idx];
          return '<div class="code-block-wrapper" data-lang="text">' +
            '<div class="code-block-header">' +
              '<span class="code-block-lang">text</span>' +
              '<button class="code-copy-btn" onclick="copyCode(this)" aria-label="Copy code">Copy</button>' +
            '</div>' +
            '<pre class="hljs"><code class="language-plaintext">' + escapeHtml(token.content) + '</code></pre>' +
          '</div>\n';
        };

        // Add heading anchor IDs
        var origHeadingOpen = md.renderer.rules.heading_open || function(tokens, idx, options, env, self) {
          return self.renderToken(tokens, idx, options);
        };
        md.renderer.rules.heading_open = function(tokens, idx, options, env, self) {
          var nextToken = tokens[idx + 1];
          if (nextToken && nextToken.type === 'inline') {
            tokens[idx].attrSet('id', slugify(nextToken.content));
          }
          return origHeadingOpen(tokens, idx, options, env, self);
        };

        // Wrap tables in responsive container
        var origTableOpen = md.renderer.rules.table_open || function(tokens, idx, options, env, self) {
          return self.renderToken(tokens, idx, options);
        };
        var origTableClose = md.renderer.rules.table_close || function(tokens, idx, options, env, self) {
          return self.renderToken(tokens, idx, options);
        };
        md.renderer.rules.table_open = function(tokens, idx, options, env, self) {
          return '<div class="table-wrapper">' + origTableOpen(tokens, idx, options, env, self);
        };
        md.renderer.rules.table_close = function(tokens, idx, options, env, self) {
          return origTableClose(tokens, idx, options, env, self) + '</div>';
        };
      }

      function slugify(text) {
        return (text || '').toLowerCase().trim()
          .replace(/[^\w\s-]/g, '')
          .replace(/[\s_-]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'section';
      }

      function escapeHtml(text) {
        return (text || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Robust line-based CommonMark segmentation preserving exact line endings
      function segmentMarkdown(markdown) {
        var lines = markdown.match(/[^\r\n]*(?:\r\n|\n|\r|$)/g) || [];
        if (lines.length > 0 && lines[lines.length - 1] === '') lines.pop();

        var segments = [];
        var currentChunk = [];
        var inCodeFence = false;
        var fenceChar = '';
        var fenceLen = 0;
        var inHtmlComment = false;

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          var cleanLine = line.replace(/[\r\n]+$/, '');
          var trimmed = cleanLine.trimStart();

          if (inCodeFence) {
            currentChunk.push(line);
            if (trimmed.startsWith(fenceChar.repeat(fenceLen))) {
              var rest = trimmed.slice(fenceLen).trim();
              if (rest === '' || rest.replace(new RegExp('\\' + fenceChar, 'g'), '') === '') {
                segments.push({ type: 'code', text: currentChunk.join('') });
                currentChunk = [];
                inCodeFence = false;
              }
            }
            continue;
          }

          if (inHtmlComment) {
            currentChunk.push(line);
            if (cleanLine.includes('-->')) {
              segments.push({ type: 'comment', text: currentChunk.join('') });
              currentChunk = [];
              inHtmlComment = false;
            }
            continue;
          }

          if (trimmed.startsWith('<!--')) {
            if (currentChunk.length > 0) {
              segments.push({ type: 'prose', text: currentChunk.join('') });
              currentChunk = [];
            }
            currentChunk.push(line);
            if (!cleanLine.includes('-->')) {
              inHtmlComment = true;
            } else {
              segments.push({ type: 'comment', text: currentChunk.join('') });
              currentChunk = [];
            }
            continue;
          }

          var fenceMatch = /^[ ]{0,3}(`{3,}|~{3,})[ \t]*(.*)$/.exec(cleanLine);
          if (fenceMatch) {
            var char = fenceMatch[1][0];
            var len = fenceMatch[1].length;
            var info = fenceMatch[2].trim();

            if (char === '~' || !info.includes('`')) {
              if (currentChunk.length > 0) {
                segments.push({ type: 'prose', text: currentChunk.join('') });
                currentChunk = [];
              }
              fenceChar = char;
              fenceLen = len;
              inCodeFence = true;
              currentChunk.push(line);
              continue;
            }
          }

          currentChunk.push(line);
        }

        if (currentChunk.length > 0) {
          segments.push({ type: inCodeFence ? 'code' : inHtmlComment ? 'comment' : 'prose', text: currentChunk.join('') });
        }

        return segments;
      }

      // Protect math blocks before markdown-it parsing
      function protectMath(markdown) {
        var items = [];
        var segments = segmentMarkdown(markdown);

        var source = segments.map(function(seg) {
          if (seg.type !== 'prose') return seg.text;

          // Inside prose: split on inline code spans to protect inline code
          var parts = seg.text.split(/(`[^`\n]+`)/g);
          return parts.map(function(part, idx) {
            if (idx % 2 === 1) return part; // inside inline code

            // 1. Replace display math $$...$$
            var p1 = part.replace(/\$\$([\s\S]+?)\$\$/g, function(_, tex) {
              var key = '@@MATH_DISP_' + items.length + '@@';
              items.push({ display: true, tex: tex.trim(), key: key });
              return '\n\n' + key + '\n\n';
            });

            // 2. Replace inline math $...$
            var p2 = p1.replace(/(^|[^\w\\\$])\$([^\s\$](?:[^\\\$]*?(?:\\.[^\\\$]*?)*?[^\s\$\\]|))\$(?!\d)/g, function(match, prefix, tex) {
              if (!tex.trim() || /\n\s*\n/.test(tex)) return match;
              var key = '@@MATH_INL_' + items.length + '@@';
              items.push({ display: false, tex: tex.trim(), key: key });
              return prefix + key;
            });

            // 3. Replace chemistry \ce{...} and units \pu{...} outside math mode
            var p3 = p2.replace(/(^|[^\\])\\(ce|pu)\{((?:[^{}]|\{[^{}]*\})*)\}/g, function(match, prefix, cmd, content) {
              var key = '@@MATH_CHEM_' + items.length + '@@';
              items.push({ display: false, tex: '\\' + cmd + '{' + content + '}', key: key });
              return prefix + key;
            });

            return p3;
          }).join('');
        }).join('');

        return { source: source, items: items };
      }

      function renderKaTeX(tex, display) {
        if (!window.katex) {
          return display ? '<div class="math-block">$$' + escapeHtml(tex) + '$$</div>' : '<span class="math-inline">$' + escapeHtml(tex) + '$</span>';
        }
        try {
          return window.katex.renderToString(tex, {
            displayMode: display,
            throwOnError: false,
            errorColor: '#ef4444',
            output: 'html',
            strict: false
          });
        } catch (e) {
          return '<span style="color:#ef4444;">[Math Error: ' + escapeHtml(e.message) + ']</span>';
        }
      }

      function restoreMath(html, items) {
        var output = html;
        for (var i = 0; i < items.length; i++) {
          var item = items[i];
          var key = item.key;
          var rendered = renderKaTeX(item.tex, item.display);
          var finalHtml = item.display ? '<div class="math-block">' + rendered + '</div>' : '<span class="math-inline">' + rendered + '</span>';

          var blockPattern = new RegExp('<p>\\s*' + key + '\\s*<\\/p>', 'g');
          output = output.replace(blockPattern, finalHtml).replaceAll(key, finalHtml);
        }
        return output;
      }

      async function renderMermaidDiagrams() {
        if (!window.mermaid) return;

        window.mermaid.initialize({
          startOnLoad: false,
          securityLevel: 'loose',
          theme: currentTheme === 'dark' ? 'dark' : 'default'
        });

        var blocks = document.querySelectorAll('.mermaid-block');
        for (var i = 0; i < blocks.length; i++) {
          var block = blocks[i];
          var source = decodeURIComponent(block.getAttribute('data-source') || '');
          var id = 'mermaid-diag-' + Math.random().toString(36).substring(2, 9);

          try {
            var result = await window.mermaid.render(id, source);
            var wrapper = document.createElement('div');
            wrapper.className = 'mermaid-diagram';
            wrapper.innerHTML = result.svg;
            block.replaceWith(wrapper);
          } catch (error) {
            var errCard = document.createElement('div');
            errCard.className = 'mermaid-error';
            errCard.innerHTML = '<div class="mermaid-error-title">Mermaid Diagram Syntax Error: ' + escapeHtml(error.message) + '</div><div class="mermaid-error-source">' + escapeHtml(source) + '</div>';
            block.replaceWith(errCard);
          }
        }
      }

      function resolveRelativeImages(container, baseDir) {
        if (!baseDir) return;
        var images = container.querySelectorAll('img');
        for (var i = 0; i < images.length; i++) {
          var img = images[i];
          var src = img.getAttribute('src');
          if (src && !src.startsWith('http://') && !src.startsWith('https://') && !src.startsWith('data:') && !src.startsWith('file://')) {
            var cleanBase = baseDir.endsWith('/') ? baseDir : baseDir + '/';
            var cleanSrc = src.startsWith('./') ? src.substring(2) : src;
            img.src = 'file://' + cleanBase + cleanSrc;
          }
        }
      }

      window.copyCode = function(button) {
        var wrapper = button.closest('.code-block-wrapper');
        if (!wrapper) return;
        var codeEl = wrapper.querySelector('code');
        if (!codeEl) return;
        var text = codeEl.innerText || codeEl.textContent || '';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function() {
            button.textContent = 'Copied!';
            button.classList.add('copied');
            setTimeout(function() {
              button.textContent = 'Copy';
              button.classList.remove('copied');
            }, 2000);
          }).catch(function() {
            fallbackCopy(text, button);
          });
        } else {
          fallbackCopy(text, button);
        }
      };

      function fallbackCopy(text, button) {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          button.textContent = 'Copied!';
          button.classList.add('copied');
          setTimeout(function() {
            button.textContent = 'Copy';
            button.classList.remove('copied');
          }, 2000);
        } catch (e) {}
      }

      window.setTheme = function(theme) {
        currentTheme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.body.className = currentTheme;
      };

      window.renderDocument = async function(markdown, theme, baseDir) {
        if (theme) window.setTheme(theme);
        if (!md) initMarkdownIt();

        var container = document.getElementById('content');
        if (!container) return;

        try {
          var protectedResult = protectMath(markdown || '');
          var rawHtml = md.render(protectedResult.source);
          var fullHtml = restoreMath(rawHtml, protectedResult.items);

          container.innerHTML = fullHtml;
          resolveRelativeImages(container, baseDir);
          await renderMermaidDiagrams();

          if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
            window.flutter_inappwebview.callHandler('onRenderComplete');
          }
        } catch (err) {
          container.innerHTML = '<div style="color:red; padding:20px;">Render Error: ' + escapeHtml(err.message) + '</div>';
        }
      };

      window.scrollToHeading = function(id) {
        var el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      window.openAboutDialog = function(version, buildTime) {
        var backdrop = document.getElementById('about-modal-backdrop');
        if (!backdrop) return;
        var heading = document.getElementById('about-version-heading');
        var metaVer = document.getElementById('about-meta-version');
        var metaTime = document.getElementById('about-meta-build-time');
        if (heading && version) heading.textContent = 'Tsuzuri ' + version;
        if (metaVer && version) metaVer.textContent = version;
        if (metaTime && buildTime) metaTime.textContent = buildTime;
        backdrop.classList.add('open');
        backdrop.setAttribute('aria-hidden', 'false');
      };

      window.closeAboutDialog = function() {
        var backdrop = document.getElementById('about-modal-backdrop');
        if (!backdrop) return;
        backdrop.classList.remove('open');
        backdrop.setAttribute('aria-hidden', 'true');
      };

      var closeAboutBtn = document.getElementById('btn-close-about-x');
      if (closeAboutBtn) {
        closeAboutBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          window.closeAboutDialog();
        });
      }
      var aboutBackdrop = document.getElementById('about-modal-backdrop');
      if (aboutBackdrop) {
        aboutBackdrop.addEventListener('click', function(e) {
          if (e.target === aboutBackdrop) {
            window.closeAboutDialog();
          }
        });
      }
      window.openActionsPopover = function(opts) {
        opts = opts || {};
        var popover = document.getElementById('actions-popover');
        var backdrop = document.getElementById('popover-backdrop');
        if (!popover || !backdrop) return;
        if (typeof opts.wordWrap === 'boolean') {
          var wrapLabel = document.getElementById('popover-wrap-label');
          if (wrapLabel) wrapLabel.textContent = 'Word Wrap: ' + (opts.wordWrap ? 'On' : 'Off');
        }
        if (opts.theme) {
          var themeBtns = document.querySelectorAll('.popover-theme-btn');
          themeBtns.forEach(function(btn) {
            btn.classList.toggle('active', btn.getAttribute('data-theme-mode') === opts.theme);
          });
        }
        popover.classList.add('open');
        popover.setAttribute('aria-hidden', 'false');
        backdrop.classList.add('open');
        backdrop.setAttribute('aria-hidden', 'false');
      };

      window.closeActionsPopover = function() {
        var popover = document.getElementById('actions-popover');
        var backdrop = document.getElementById('popover-backdrop');
        if (popover) {
          popover.classList.remove('open');
          popover.setAttribute('aria-hidden', 'true');
        }
        if (backdrop) {
          backdrop.classList.remove('open');
          backdrop.setAttribute('aria-hidden', 'true');
        }
      };

      window.toggleActionsPopover = function(opts) {
        var popover = document.getElementById('actions-popover');
        if (popover && popover.classList.contains('open')) {
          window.closeActionsPopover();
        } else {
          window.openActionsPopover(opts);
        }
      };

      window.sendAction = function(action) {
        window.closeActionsPopover();
        if (window.TsuzuriHost && window.TsuzuriHost.postMessage) {
          window.TsuzuriHost.postMessage(action);
        } else {
          window.location.href = 'tsuzuri-action://' + action;
        }
      };

      window.selectTheme = function(mode) {
        var themeBtns = document.querySelectorAll('.popover-theme-btn');
        themeBtns.forEach(function(btn) {
          btn.classList.toggle('active', btn.getAttribute('data-theme-mode') === mode);
        });
        if (window.TsuzuriHost && window.TsuzuriHost.postMessage) {
          window.TsuzuriHost.postMessage('theme:' + mode);
        } else {
          window.location.href = 'tsuzuri-action://theme:' + mode;
        }
      };

      var closePopoverBtn = document.getElementById('btn-close-popover-x');
      if (closePopoverBtn) {
        closePopoverBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          window.closeActionsPopover();
        });
      }
      var popoverBackdrop = document.getElementById('popover-backdrop');
      if (popoverBackdrop) {
        popoverBackdrop.addEventListener('click', function(e) {
          window.closeActionsPopover();
        });
      }

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          window.closeAboutDialog();
          window.closeActionsPopover();
        }
      });
      var githubLink = document.getElementById('about-github-link');
      if (githubLink) {
        githubLink.addEventListener('click', function(e) {
          e.preventDefault();
          if (navigator.clipboard) {
            navigator.clipboard.writeText('https://github.com/ameya-deshpande-5056/Tsuzuri-v2');
          }
        });
      }

      // Auto-initialize on load
      initMarkdownIt();
    })();
  </script>
